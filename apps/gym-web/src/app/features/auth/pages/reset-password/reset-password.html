<div class="min-h-screen flex items-center justify-center bg-slate-900 px-4">
  <div
    class="max-w-md w-full bg-slate-800 rounded-xl p-8 shadow-lg border border-slate-700"
  >
    <h2 class="text-2xl font-bold text-white text-center mb-2">
      استعادة كلمة المرور
    </h2>
    <p class="text-slate-400 text-sm text-center mb-6">
      أدخل بريدك الإلكتروني المسجل وسنرسل لك رابط إعادة تعيين كلمة المرور.
    </p>

    @if (feedbackMessage()) {
    <div
      class="p-3 mb-4 text-sm bg-blue-500/10 border border-blue-500/30 text-blue-400 rounded-lg text-center"
    >
      {{ feedbackMessage() }}
    </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-300 mb-1"
          >البريد الإلكتروني</label
        >
        <input
          type="email"
          formControlName="email"
          class="w-full px-4 py-2 rounded-lg bg-slate-950 border border-slate-700 text-white focus:outline-none focus:border-amber-500"
          placeholder="name@example.com"
        />
      </div>

      <button
        type="submit"
        [disabled]="form.invalid || isLoading()"
        class="w-full py-2.5 px-4 bg-amber-500 hover:bg-amber-600 disabled:opacity-50 text-slate-950 font-semibold rounded-lg transition duration-200"
      >
        {{ isLoading() ? 'جاري الإرسال...' : 'إرسال الرابط' }}
      </button>
    </form>

    <div class="mt-6 text-center">
      <a routerLink="/login" class="text-sm text-amber-500 hover:underline"
        >العودة لتسجيل الدخول</a
      >
    </div>
  </div>
</div>
